<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>사업 진행 현황</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 상단 바(담당자·기준일) → 탭 4개 → 납기 관리은 협력사 묶음, 전체 라인은 가상 스크롤 표, 오른쪽 상세 패널 */
:root{
  --bg:#F1F4F6; --surface:#FFFFFF; --surface-2:#E8EDF1; --line:#D3DAE1;
  --ink:#15202A; --ink-2:#465665; --ink-3:#6B7A88;
  --accent:#0D5B79; --accent-ink:#FFFFFF; --accent-soft:#DAEAF0;
  --late:#B3271E; --late-soft:#FBE3DF; --late-2:#7E1A14;
  --soon:#935500; --soon-soft:#FBEACB;
  --ok:#1D7550; --ok-soft:#DCEFE5;
  --b1:#2B7A9B; --b2:#5E9DB5; --b3:#9CC0CF;
  --font-body:'IBM Plex Sans KR',system-ui,-apple-system,'Segoe UI','Malgun Gothic',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F161C; --surface:#18222B; --surface-2:#202C37; --line:#2D3B48;
    --ink:#E7EDF2; --ink-2:#AEBAC5; --ink-3:#8696A4;
    --accent:#62B8D8; --accent-ink:#06222D; --accent-soft:#17323E;
    --late:#FF8F83; --late-soft:#3B1F1C; --late-2:#FF6B5C;
    --soon:#F2BC5E; --soon-soft:#3A2B10;
    --ok:#6FCD9E; --ok-soft:#14301F;
    --b1:#4FA3C4; --b2:#3C7F9B; --b3:#2D5E74;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F161C; --surface:#18222B; --surface-2:#202C37; --line:#2D3B48;
  --ink:#E7EDF2; --ink-2:#AEBAC5; --ink-3:#8696A4;
  --accent:#62B8D8; --accent-ink:#06222D; --accent-soft:#17323E;
  --late:#FF8F83; --late-soft:#3B1F1C; --late-2:#FF6B5C;
  --soon:#F2BC5E; --soon-soft:#3A2B10;
  --ok:#6FCD9E; --ok-soft:#14301F;
  --b1:#4FA3C4; --b2:#3C7F9B; --b3:#2D5E74;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:14px; line-height:1.45;
  padding-block:16px 96px;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}
.app{max-width:1400px;margin:0 auto}
h1,h2,h3,p{margin:0}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0;max-width:100%}
input[type=checkbox]{width:16px;height:16px;padding:0;accent-color:var(--accent)}
input:disabled,select:disabled,textarea:disabled{opacity:.55}
textarea{width:100%;resize:vertical}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:6px 12px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:3px 9px;font-size:12px}
.lnk{background:none;border:0;padding:2px 4px;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-size:12px}
.tag{display:inline-block;font-size:11px;line-height:1;padding:3px 6px;border-radius:4px;border:1px solid var(--line);color:var(--ink-2);background:var(--surface);white-space:nowrap}
.tag.part{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.tag.erp{background:var(--soon-soft);border-color:transparent;color:var(--soon);font-weight:600}
.tag.late{background:var(--late-soft);border-color:transparent;color:var(--late);font-weight:600}
.tag.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok);font-weight:600}
.tag.ext{border-color:var(--accent);color:var(--accent)}
.help{font-size:12px;color:var(--ink-3)}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-2);min-width:0}

/* top bar */
.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
.top h1{font-size:21px;font-weight:700;letter-spacing:-.01em}
.top .meta{font-size:12px;color:var(--ink-2);margin-top:2px}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.sync{font-size:12px;padding:3px 8px;border-radius:10px;background:var(--surface-2);color:var(--ink-2);align-self:center}
.sync.live{background:var(--ok-soft);color:var(--ok)}
.sync.bad{background:var(--late-soft);color:var(--late)}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;cursor:pointer;color:var(--ink-2);font-weight:500;white-space:nowrap;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .n{font-family:var(--font-mono);font-size:12px;margin-left:6px;padding:1px 6px;border-radius:9px;background:var(--surface-2);color:var(--ink-2)}
.tab .n.hot{background:var(--late-soft);color:var(--late)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:8px;margin-bottom:12px}
.kpi{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;display:flex;flex-direction:column}
.kpi:hover{border-color:var(--ink-3)}
.kpi[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.kpi .l{font-size:12px;color:var(--ink-2)}
.kpi .v{font-family:var(--font-mono);font-size:24px;font-weight:500;line-height:1.2}
.kpi .h{font-size:11px;color:var(--ink-3)}
.kpi.ok .v{color:var(--ok)} .kpi.late .v{color:var(--late)} .kpi.soon .v{color:var(--soon)} .kpi.erp .v{color:var(--soon)}
.rule{font-size:12px;color:var(--ink-3);margin-bottom:10px}

/* chips for due */
.chip{display:inline-flex;flex-direction:column;align-items:flex-start;padding:3px 8px;border-radius:6px;min-width:64px;line-height:1.2}
.chip b{font-family:var(--font-mono);font-weight:500;font-size:14px;white-space:nowrap}
.chip small{font-size:11px}
.s-late{background:var(--late-soft);color:var(--late)}
.s-soon{background:var(--soon-soft);color:var(--soon)}
.s-ok{background:var(--surface-2);color:var(--ink-2)}
.s-conf{background:var(--ok-soft);color:var(--ok)}

/* progress bar */
.bar{display:flex;height:8px;border-radius:2px;border:1px solid var(--line);overflow:hidden;background:var(--surface)}
.bar i{display:block;height:100%}
.bar .r{background:var(--accent)}
.bar .p{background:repeating-linear-gradient(135deg,var(--b2) 0 3px,transparent 3px 6px)}
.pn{font-size:12px;color:var(--ink-2);display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:3px}
.item{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.sub{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.due{font-weight:500;font-size:13px;white-space:nowrap}
.due-sub{font-size:11px;color:var(--ink-3)}
.due-sub.up{color:var(--late)}
.due-sub.erpw{color:var(--soon);font-weight:600}

/* queue */
.qhead,.qr{display:grid;grid-template-columns:24px minmax(190px,1.5fr) 190px 150px 84px 128px 128px 104px 64px minmax(160px,1fr);gap:10px;align-items:center;padding:8px 12px}
.qhead{font-size:11px;color:var(--ink-3);letter-spacing:.03em;background:var(--surface-2);border:1px solid var(--line);border-radius:8px 8px 0 0}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-top:10px;overflow:hidden}
.gh{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:9px 12px;background:var(--surface)}
.gtog{background:none;border:0;cursor:pointer;display:flex;align-items:center;gap:8px;min-width:0;text-align:left;padding:2px 0;flex:1 1 260px}
.gtog .ar{font-family:var(--font-mono);width:14px;color:var(--ink-3)}
.gname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gchips{display:flex;gap:6px;flex-wrap:wrap}
.gact{display:flex;gap:6px;margin-left:auto}
.qr{border-top:1px solid var(--line)}
.qr:hover{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
.qr.done{opacity:.6}
.qr .lab{display:none;font-size:11px;color:var(--ink-3)}
.qr .ci{min-width:0}
.qr input[type=date],.qr select,.qr input[type=text],.qr input[type=number]{width:100%}
.c-rc{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink-3)}.c-rc input{width:22px;height:22px}
.poid{font-family:var(--font-mono);font-size:12px;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.lastn{font-size:11px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.empty{padding:28px 16px;color:var(--ink-3);text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:8px}

/* all lines */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:8px}
.tools .grow{flex:1 1 200px;max-width:300px}
.tools .cnt{margin-left:auto;font-size:12px;color:var(--ink-3);align-self:center}
.hist{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:6px}
.hb{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px 7px;cursor:pointer;text-align:left;min-width:0}
.hb[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.hb .t{font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .n{font-family:var(--font-mono);font-size:16px;line-height:1.3}
.hb .m{height:5px;border-radius:2px;margin-top:3px}
.legend{font-size:11px;color:var(--ink-3);margin-bottom:8px;display:flex;flex-wrap:wrap;gap:4px 14px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.vwrap{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.vhead,.vr{display:grid;grid-template-columns:24px 84px minmax(0,1.6fr) 180px 160px 150px minmax(0,1fr);gap:10px;align-items:center;padding:0 12px}
.vhead{height:34px;font-size:11px;color:var(--ink-3);background:var(--surface-2);border-bottom:1px solid var(--line)}
.vhead button{background:none;border:0;padding:0;font-size:11px;color:var(--ink-3);cursor:pointer;text-align:left}
#vt{overflow:auto;height:min(64vh,640px);min-height:320px;position:relative}
#vin{position:relative}
.vr{position:absolute;left:0;right:0;border-bottom:1px solid var(--line);cursor:pointer;background:var(--surface)}
.vr:hover{background:var(--surface-2)}
.vr.sel{background:var(--accent-soft)}
.vr .ci{min-width:0}
.vr .nt{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* bulk bar */
.bulk{position:fixed;left:0;right:0;bottom:0;z-index:12;background:var(--surface);border-top:2px solid var(--accent);box-shadow:0 -8px 24px rgba(0,0,0,.14);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bulk .in{max-width:1400px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-end}
.bulk .cnt{font-weight:600;align-self:center}
.bg{display:flex;gap:6px;align-items:flex-end}
.bg label.f{min-width:0}

/* team */
.tbl{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tbl th,.tbl td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:right;font-size:13px}
.tbl th{background:var(--surface-2);font-size:11px;color:var(--ink-3);font-weight:500;letter-spacing:.03em}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td button{background:none;border:0;cursor:pointer;font-family:var(--font-mono);font-size:13px;color:var(--ink);padding:2px 6px;border-radius:4px}
.tbl td button:hover{background:var(--accent-soft)}
.tbl td .z{color:var(--ink-3)}
.tbl td.late button{color:var(--late)} .tbl td.soon button{color:var(--soon)}
.tscroll{overflow-x:auto}

/* compliance */
.cstrip{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.cc{display:inline-flex;gap:6px;align-items:baseline;padding:4px 9px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:12px}
.cc b{font-weight:600}
.cc.ok{border-color:var(--ok);color:var(--ok)} .cc.mid{border-color:var(--soon);color:var(--soon)} .cc.low{border-color:var(--late);color:var(--late);background:var(--late-soft)} .cc.none{border-style:dashed;color:var(--ink-3)}
.pbar{display:inline-flex;width:110px;vertical-align:middle;margin-right:8px}
/* 팀 입력 현황 패널 */
.cpanel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.chead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-end;justify-content:space-between;margin-bottom:10px}
.chead h3{font-size:16px;margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cbig{font-family:var(--font-mono);font-size:30px;font-weight:500;line-height:1}
.cbtns{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.cwarn{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-radius:8px;margin-bottom:10px;font-size:13px;font-weight:500}
.cwarn.bad{background:var(--late-soft);color:var(--late)} .cwarn.good{background:var(--ok-soft);color:var(--ok)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.cd{text-align:left;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--ink-3);border-radius:8px;padding:6px 10px 7px;cursor:pointer;display:flex;flex-direction:column;gap:1px;min-width:0}
.cd:hover{border-color:var(--ink-3)}
.cd.me{box-shadow:0 0 0 2px var(--accent)}
.cd .cn{font-weight:700;font-size:14px;display:flex;justify-content:space-between;gap:6px;align-items:center}
.cd .cs{font-size:12px;font-weight:600}
.cd .cp{font-family:var(--font-mono);font-size:24px;line-height:1.05;font-weight:500}
.cd .cbar{display:block;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin:3px 0}
.cd .cbar i{display:block;height:100%;background:currentColor}
.cd .cm,.cd .cl{font-size:12px;color:var(--ink-2)}
.cd .cl{color:var(--ink-3)}
.cd.ok{border-top-color:var(--ok);color:var(--ok)} .cd.mid{border-top-color:var(--soon);color:var(--soon)} .cd.low{border-top-color:var(--late);color:var(--late);background:var(--late-soft)} .cd.none{border-top-color:var(--ink-3);border-style:dashed;color:var(--ink-3)}
.cd .cm,.cd .cl{color:var(--ink-2)} .cd.low .cl{color:var(--late)}
.bar.dn .r{background:var(--ok)}
/* 업무 지시 */
.tkbanner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 12px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:600;margin-bottom:10px;border:1px solid var(--accent)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.seg button{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:5px 12px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg .n{font-family:var(--font-mono);margin-left:5px}
.rcp{display:flex;gap:6px;flex-wrap:wrap}
.rcp button{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 10px;cursor:pointer;font-size:12px}
.rcp button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.tkf{display:grid;gap:10px}
.tkl{display:grid;gap:8px}
.tk{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--ink-3);border-radius:8px;padding:10px 14px}
.tk.new{border-left-color:var(--accent)} .tk.doing{border-left-color:var(--soon)} .tk.done{border-left-color:var(--ok);opacity:.82}
.tk.hi{box-shadow:0 0 0 1px var(--late)}
.tk h4{margin:0;font-size:14px;font-weight:600;overflow-wrap:anywhere}
.tk .tm{font-size:12px;color:var(--ink-2);display:flex;gap:4px 10px;flex-wrap:wrap;margin:2px 0 6px;align-items:center}
.tk .tb{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;margin-bottom:6px}
.tk .tc{font-size:12px;color:var(--ink-2);border-top:1px dashed var(--line);padding:4px 0}
.tk .ta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.tk .ta input[type=text]{flex:1 1 180px}
.tkh{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
/* 업무 보드 */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:start}
.col{background:var(--surface-2);border-radius:8px;padding:8px;display:grid;gap:8px;min-width:0}
.colh{display:flex;justify-content:space-between;align-items:center}
.board .tk .ta input[type=text]{flex:1 1 100%}
@media (max-width:1100px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.board{grid-template-columns:minmax(0,1fr)}}
.tk.ck{border-left-color:var(--ok)}
/* 간트 */
.gk{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.gk .kpi{cursor:default;min-width:120px}
.gwrap{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.gscroll{overflow:auto;max-height:68vh}
.gin{position:relative}
.gxh,.gr{display:flex}
.gxh{position:sticky;top:0;z-index:3;background:var(--surface-2);border-bottom:1px solid var(--line);height:44px}
.gl{flex:none;width:250px;position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--line);padding:6px 10px;min-width:0}
.gxh .gl{background:var(--surface-2);font-size:11px;color:var(--ink-3);display:flex;align-items:flex-end}
.gr{border-bottom:1px solid var(--line);min-height:50px;cursor:pointer}
.gr:hover .gl,.gr:hover{background:color-mix(in srgb,var(--surface-2) 60%,var(--surface))}
.gb{position:relative;flex:none;height:50px}
.ggr{display:flex;cursor:pointer;background:var(--surface-2);border-bottom:1px solid var(--line);border-top:1px solid var(--line);height:34px}
.ggr .gl{background:var(--surface-2);display:flex;align-items:center;gap:6px;font-weight:700;padding:4px 10px;white-space:nowrap;overflow:hidden}
.ggr .gl .gn{flex:none}
.ggr .gl .tg{flex:none;white-space:nowrap}
.ggr .gl .cnt{font-weight:500;font-size:11px;color:var(--ink-3)}
.ggr .gl .ar{display:inline-block;width:10px;color:var(--ink-3);font-size:10px}
.ggr .gl .tg{font-size:10px;font-weight:600;padding:1px 6px;border-radius:9px;background:color-mix(in srgb,var(--late) 14%,transparent);color:var(--late)}
.ggr .gl .tg.s{background:color-mix(in srgb,var(--soon) 16%,transparent);color:var(--soon)}
.ggr .gb{height:34px}
.gspan{position:absolute;top:13px;height:8px;border-radius:4px;background:var(--ink-3);opacity:.35}

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 상단 바(담당자·기준일) → 탭 4개 → 납기 관리은 협력사 묶음, 전체 라인은 가상 스크롤 표, 오른쪽 상세 패널 */
:root{
  --bg:#F1F4F6; --surface:#FFFFFF; --surface-2:#E8EDF1; --line:#D3DAE1;
  --ink:#15202A; --ink-2:#465665; --ink-3:#6B7A88;
  --accent:#0D5B79; --accent-ink:#FFFFFF; --accent-soft:#DAEAF0;
  --late:#B3271E; --late-soft:#FBE3DF; --late-2:#7E1A14;
  --soon:#935500; --soon-soft:#FBEACB;
  --ok:#1D7550; --ok-soft:#DCEFE5;
  --b1:#2B7A9B; --b2:#5E9DB5; --b3:#9CC0CF;
  --font-body:'IBM Plex Sans KR',system-ui,-apple-system,'Segoe UI','Malgun Gothic',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F161C; --surface:#18222B; --surface-2:#202C37; --line:#2D3B48;
    --ink:#E7EDF2; --ink-2:#AEBAC5; --ink-3:#8696A4;
    --accent:#62B8D8; --accent-ink:#06222D; --accent-soft:#17323E;
    --late:#FF8F83; --late-soft:#3B1F1C; --late-2:#FF6B5C;
    --soon:#F2BC5E; --soon-soft:#3A2B10;
    --ok:#6FCD9E; --ok-soft:#14301F;
    --b1:#4FA3C4; --b2:#3C7F9B; --b3:#2D5E74;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F161C; --surface:#18222B; --surface-2:#202C37; --line:#2D3B48;
  --ink:#E7EDF2; --ink-2:#AEBAC5; --ink-3:#8696A4;
  --accent:#62B8D8; --accent-ink:#06222D; --accent-soft:#17323E;
  --late:#FF8F83; --late-soft:#3B1F1C; --late-2:#FF6B5C;
  --soon:#F2BC5E; --soon-soft:#3A2B10;
  --ok:#6FCD9E; --ok-soft:#14301F;
  --b1:#4FA3C4; --b2:#3C7F9B; --b3:#2D5E74;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:14px; line-height:1.45;
  padding-block:16px 96px;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
}
.app{max-width:1400px;margin:0 auto}
h1,h2,h3,p{margin:0}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0;max-width:100%}
input[type=checkbox]{width:16px;height:16px;padding:0;accent-color:var(--accent)}
input:disabled,select:disabled,textarea:disabled{opacity:.55}
textarea{width:100%;resize:vertical}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:6px 12px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:3px 9px;font-size:12px}
.lnk{background:none;border:0;padding:2px 4px;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px;font-size:12px}
.tag{display:inline-block;font-size:11px;line-height:1;padding:3px 6px;border-radius:4px;border:1px solid var(--line);color:var(--ink-2);background:var(--surface);white-space:nowrap}
.tag.part{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.tag.erp{background:var(--soon-soft);border-color:transparent;color:var(--soon);font-weight:600}
.tag.late{background:var(--late-soft);border-color:transparent;color:var(--late);font-weight:600}
.tag.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok);font-weight:600}
.tag.ext{border-color:var(--accent);color:var(--accent)}
.help{font-size:12px;color:var(--ink-3)}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-2);min-width:0}

/* top bar */
.top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
.top h1{font-size:21px;font-weight:700;letter-spacing:-.01em}
.top .meta{font-size:12px;color:var(--ink-2);margin-top:2px}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.sync{font-size:12px;padding:3px 8px;border-radius:10px;background:var(--surface-2);color:var(--ink-2);align-self:center}
.sync.live{background:var(--ok-soft);color:var(--ok)}
.sync.bad{background:var(--late-soft);color:var(--late)}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;cursor:pointer;color:var(--ink-2);font-weight:500;white-space:nowrap;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.tab .n{font-family:var(--font-mono);font-size:12px;margin-left:6px;padding:1px 6px;border-radius:9px;background:var(--surface-2);color:var(--ink-2)}
.tab .n.hot{background:var(--late-soft);color:var(--late)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:8px;margin-bottom:12px}
.kpi{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;cursor:pointer;display:flex;flex-direction:column}
.kpi:hover{border-color:var(--ink-3)}
.kpi[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.kpi .l{font-size:12px;color:var(--ink-2)}
.kpi .v{font-family:var(--font-mono);font-size:24px;font-weight:500;line-height:1.2}
.kpi .h{font-size:11px;color:var(--ink-3)}
.kpi.ok .v{color:var(--ok)} .kpi.late .v{color:var(--late)} .kpi.soon .v{color:var(--soon)} .kpi.erp .v{color:var(--soon)}
.rule{font-size:12px;color:var(--ink-3);margin-bottom:10px}

/* chips for due */
.chip{display:inline-flex;flex-direction:column;align-items:flex-start;padding:3px 8px;border-radius:6px;min-width:64px;line-height:1.2}
.chip b{font-family:var(--font-mono);font-weight:500;font-size:14px;white-space:nowrap}
.chip small{font-size:11px}
.s-late{background:var(--late-soft);color:var(--late)}
.s-soon{background:var(--soon-soft);color:var(--soon)}
.s-ok{background:var(--surface-2);color:var(--ink-2)}
.s-conf{background:var(--ok-soft);color:var(--ok)}

/* progress bar */
.bar{display:flex;height:8px;border-radius:2px;border:1px solid var(--line);overflow:hidden;background:var(--surface)}
.bar i{display:block;height:100%}
.bar .r{background:var(--accent)}
.bar .p{background:repeating-linear-gradient(135deg,var(--b2) 0 3px,transparent 3px 6px)}
.pn{font-size:12px;color:var(--ink-2);display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-top:3px}
.item{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.sub{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.due{font-weight:500;font-size:13px;white-space:nowrap}
.due-sub{font-size:11px;color:var(--ink-3)}
.due-sub.up{color:var(--late)}
.due-sub.erpw{color:var(--soon);font-weight:600}

/* queue */
.qhead,.qr{display:grid;grid-template-columns:24px minmax(190px,1.5fr) 190px 150px 84px 128px 128px 104px 64px minmax(160px,1fr);gap:10px;align-items:center;padding:8px 12px}
.qhead{font-size:11px;color:var(--ink-3);letter-spacing:.03em;background:var(--surface-2);border:1px solid var(--line);border-radius:8px 8px 0 0}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-top:10px;overflow:hidden}
.gh{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:9px 12px;background:var(--surface)}
.gtog{background:none;border:0;cursor:pointer;display:flex;align-items:center;gap:8px;min-width:0;text-align:left;padding:2px 0;flex:1 1 260px}
.gtog .ar{font-family:var(--font-mono);width:14px;color:var(--ink-3)}
.gname{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gchips{display:flex;gap:6px;flex-wrap:wrap}
.gact{display:flex;gap:6px;margin-left:auto}
.qr{border-top:1px solid var(--line)}
.qr:hover{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
.qr.done{opacity:.6}
.qr .lab{display:none;font-size:11px;color:var(--ink-3)}
.qr .ci{min-width:0}
.qr input[type=date],.qr select,.qr input[type=text],.qr input[type=number]{width:100%}
.c-rc{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--ink-3)}.c-rc input{width:22px;height:22px}
.poid{font-family:var(--font-mono);font-size:12px;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.lastn{font-size:11px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.empty{padding:28px 16px;color:var(--ink-3);text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:8px}

/* all lines */
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:8px}
.tools .grow{flex:1 1 200px;max-width:300px}
.tools .cnt{margin-left:auto;font-size:12px;color:var(--ink-3);align-self:center}
.hist{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:6px}
.hb{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px 7px;cursor:pointer;text-align:left;min-width:0}
.hb[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.hb .t{font-size:11px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .n{font-family:var(--font-mono);font-size:16px;line-height:1.3}
.hb .m{height:5px;border-radius:2px;margin-top:3px}
.legend{font-size:11px;color:var(--ink-3);margin-bottom:8px;display:flex;flex-wrap:wrap;gap:4px 14px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.vwrap{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.vhead,.vr{display:grid;grid-template-columns:24px 84px minmax(0,1.6fr) 180px 160px 150px minmax(0,1fr);gap:10px;align-items:center;padding:0 12px}
.vhead{height:34px;font-size:11px;color:var(--ink-3);background:var(--surface-2);border-bottom:1px solid var(--line)}
.vhead button{background:none;border:0;padding:0;font-size:11px;color:var(--ink-3);cursor:pointer;text-align:left}
#vt{overflow:auto;height:min(64vh,640px);min-height:320px;position:relative}
#vin{position:relative}
.vr{position:absolute;left:0;right:0;border-bottom:1px solid var(--line);cursor:pointer;background:var(--surface)}
.vr:hover{background:var(--surface-2)}
.vr.sel{background:var(--accent-soft)}
.vr .ci{min-width:0}
.vr .nt{font-size:12px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

/* bulk bar */
.bulk{position:fixed;left:0;right:0;bottom:0;z-index:12;background:var(--surface);border-top:2px solid var(--accent);box-shadow:0 -8px 24px rgba(0,0,0,.14);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bulk .in{max-width:1400px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-end}
.bulk .cnt{font-weight:600;align-self:center}
.bg{display:flex;gap:6px;align-items:flex-end}
.bg label.f{min-width:0}

/* team */
.tbl{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.tbl th,.tbl td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:right;font-size:13px}
.tbl th{background:var(--surface-2);font-size:11px;color:var(--ink-3);font-weight:500;letter-spacing:.03em}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td button{background:none;border:0;cursor:pointer;font-family:var(--font-mono);font-size:13px;color:var(--ink);padding:2px 6px;border-radius:4px}
.tbl td button:hover{background:var(--accent-soft)}
.tbl td .z{color:var(--ink-3)}
.tbl td.late button{color:var(--late)} .tbl td.soon button{color:var(--soon)}
.tscroll{overflow-x:auto}

/* compliance */
.cstrip{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.cc{display:inline-flex;gap:6px;align-items:baseline;padding:4px 9px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:12px}
.cc b{font-weight:600}
.cc.ok{border-color:var(--ok);color:var(--ok)} .cc.mid{border-color:var(--soon);color:var(--soon)} .cc.low{border-color:var(--late);color:var(--late);background:var(--late-soft)} .cc.none{border-style:dashed;color:var(--ink-3)}
.pbar{display:inline-flex;width:110px;vertical-align:middle;margin-right:8px}
/* 팀 입력 현황 패널 */
.cpanel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.chead{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:flex-end;justify-content:space-between;margin-bottom:10px}
.chead h3{font-size:16px;margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cbig{font-family:var(--font-mono);font-size:30px;font-weight:500;line-height:1}
.cbtns{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.cwarn{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 12px;border-radius:8px;margin-bottom:10px;font-size:13px;font-weight:500}
.cwarn.bad{background:var(--late-soft);color:var(--late)} .cwarn.good{background:var(--ok-soft);color:var(--ok)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.cd{text-align:left;background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--ink-3);border-radius:8px;padding:6px 10px 7px;cursor:pointer;display:flex;flex-direction:column;gap:1px;min-width:0}
.cd:hover{border-color:var(--ink-3)}
.cd.me{box-shadow:0 0 0 2px var(--accent)}
.cd .cn{font-weight:700;font-size:14px;display:flex;justify-content:space-between;gap:6px;align-items:center}
.cd .cs{font-size:12px;font-weight:600}
.cd .cp{font-family:var(--font-mono);font-size:24px;line-height:1.05;font-weight:500}
.cd .cbar{display:block;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin:3px 0}
.cd .cbar i{display:block;height:100%;background:currentColor}
.cd .cm,.cd .cl{font-size:12px;color:var(--ink-2)}
.cd .cl{color:var(--ink-3)}
.cd.ok{border-top-color:var(--ok);color:var(--ok)} .cd.mid{border-top-color:var(--soon);color:var(--soon)} .cd.low{border-top-color:var(--late);color:var(--late);background:var(--late-soft)} .cd.none{border-top-color:var(--ink-3);border-style:dashed;color:var(--ink-3)}
.cd .cm,.cd .cl{color:var(--ink-2)} .cd.low .cl{color:var(--late)}
.bar.dn .r{background:var(--ok)}
/* 업무 지시 */
.tkbanner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 12px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-weight:600;margin-bottom:10px;border:1px solid var(--accent)}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.seg button{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:5px 12px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.seg .n{font-family:var(--font-mono);margin-left:5px}
.rcp{display:flex;gap:6px;flex-wrap:wrap}
.rcp button{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 10px;cursor:pointer;font-size:12px}
.rcp button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.tkf{display:grid;gap:10px}
.tkl{display:grid;gap:8px}
.tk{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--ink-3);border-radius:8px;padding:10px 14px}
.tk.new{border-left-color:var(--accent)} .tk.doing{border-left-color:var(--soon)} .tk.done{border-left-color:var(--ok);opacity:.82}
.tk.hi{box-shadow:0 0 0 1px var(--late)}
.tk h4{margin:0;font-size:14px;font-weight:600;overflow-wrap:anywhere}
.tk .tm{font-size:12px;color:var(--ink-2);display:flex;gap:4px 10px;flex-wrap:wrap;margin:2px 0 6px;align-items:center}
.tk .tb{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;margin-bottom:6px}
.tk .tc{font-size:12px;color:var(--ink-2);border-top:1px dashed var(--line);padding:4px 0}
.tk .ta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px}
.tk .ta input[type=text]{flex:1 1 180px}
.tkh{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
/* 업무 보드 */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;align-items:start}
.col{background:var(--surface-2);border-radius:8px;padding:8px;display:grid;gap:8px;min-width:0}
.colh{display:flex;justify-content:space-between;align-items:center}
.board .tk .ta input[type=text]{flex:1 1 100%}
@media (max-width:1100px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.board{grid-template-columns:minmax(0,1fr)}}
.tk.ck{border-left-color:var(--ok)}
/* 간트 */
.gk{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.gk .kpi{cursor:default;min-width:120px}
.gwrap{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.gscroll{overflow:auto;max-height:68vh}
.gin{position:relative}
.gxh,.gr{display:flex}
.gxh{position:sticky;top:0;z-index:3;background:var(--surface-2);border-bottom:1px solid var(--line);height:44px}
.gl{flex:none;width:250px;position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--line);padding:6px 10px;min-width:0}
.gxh .gl{background:var(--surface-2);font-size:11px;color:var(--ink-3);display:flex;align-items:flex-end}
.gr{border-bottom:1px solid var(--line);min-height:50px;cursor:pointer}
.gr:hover .gl,.gr:hover{background:color-mix(in srgb,var(--surface-2) 60%,var(--surface))}
.gb{position:relative;flex:none;height:50px}
.ggr{display:flex;cursor:pointer;background:var(--surface-2);border-bottom:1px solid var(--line);border-top:1px solid var(--line);height:34px}
.ggr .gl{background:var(--surface-2);display:flex;align-items:center;gap:6px;font-weight:700;padding:4px 10px;white-space:nowrap;overflow:hidden}
.ggr .gl .gn{flex:none}
.ggr .gl .tg{flex:none;white-space:nowrap}
.ggr .gl .cnt{font-weight:500;font-size:11px;color:var(--ink-3)}
.ggr .gl .ar{display:inline-block;width:10px;color:var(--ink-3);font-size:10px}
.ggr .gl .tg{font-size:10px;font-weight:600;padding:1px 6px;border-radius:9px;background:color-mix(in srgb,var(--late) 14%,transparent);color:var(--late)}
.ggr .gl .tg.s{background:color-mix(in srgb,var(--soon) 16%,transparent);color:var(--soon)}
.ggr .gb{height:34px}
.gspan{position:absolute;top:13px;height:8px;border-radius:4px;background:var(--ink-3);opacity:.35}
.ghb{position:relative;flex:none;height:44px}
.gm{position:absolute;top:2px;font-size:11px;font-weight:600;color:var(--ink-2);border-left:1px solid var(--line);padding-left:4px;height:20px;white-space:nowrap}

<script>
/* 구글 시트 저장소 연결 (Apps Script 웹앱). 아래 두 값만 채우면 됩니다. */
(function(){
  const GS_URL=window.GS_URL||'';   // 예: https://script.google.com/macros/s/XXXX/exec
  const GS_KEY=window.GS_KEY||'';   // Code.gs 의 KEY 와 같은 값
  const POLL=window.GS_POLL||8000;
  if(!GS_URL||!GS_KEY){console.warn('GS_URL/GS_KEY 가 비어 있어 조회 전용으로 열립니다.');return}
  const PEOPLE=['이준영','박형식','조재완','이주희','김혜린','김형수','김태희','김소현','신승희','이민정','김지은'];
  const cache=new Map(),subs=[];let since=0,ready=false,failed=0;
  function lg(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function ls(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function snap(c){
    const docs=[];cache.forEach((v,k)=>{if(k.indexOf(c+'/')===0)docs.push({id:k.slice(c.length+1),exists:true,data:()=>JSON.parse(JSON.stringify(v))})});
    return {docs:docs,size:docs.length,empty:!docs.length};
  }
  function fire(){subs.forEach(s=>{try{s[1](snap(s[0]))}catch(e){console.error(e)}})}
  async function call(method,body){
    const url=GS_URL+(method==='GET'?'?key='+encodeURIComponent(GS_KEY)+'&since='+since:'');
    const r=await fetch(url,method==='GET'?{}:{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({key:GS_KEY},body))});
    const j=await r.json();if(!j.ok)throw new Error(j.error||'서버 오류');return j;
  }
  async function pull(){
    try{
      const j=await call('GET');
      let ch=false;
      (j.docs||[]).forEach(d=>{
        const k=d.c+'/'+d.id;
        if(d.d===''||d.d==null){if(cache.delete(k))ch=true}
        else{const v=JSON.parse(d.d);if(JSON.stringify(cache.get(k))!==d.d){cache.set(k,v);ch=true}}
        if(d.u>since)since=d.u;
      });
      if(j.now&&!since)since=j.now;
      failed=0;
      if(ch||!ready){ready=true;fire()}
    }catch(e){failed++;if(!ready&&failed>=2){subs.forEach(s=>{try{s[2]&&s[2](e)}catch(_){}})}}
  }
  setInterval(()=>{if(!document.hidden)pull()},POLL);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
  const db={
    collection(c){return {onSnapshot(next,err){subs.push([c,next,err]);if(ready)setTimeout(()=>next(snap(c)),0);else if(subs.length===1)pull();return ()=>{}}}},
    doc(p){const i=p.indexOf('/'),c=p.slice(0,i),id=p.slice(i+1);return {
      async set(d){await call('POST',{op:'set',c:c,id:id,d:JSON.stringify(d),by:lg('nb.me')||''});cache.set(p,JSON.parse(JSON.stringify(d)));fire()},
      async delete(){await call('POST',{op:'del',c:c,id:id,by:lg('nb.me')||''});cache.delete(p);fire()}}}
  };
  async function askName(){
    return new Promise(res=>{
      const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:99999;display:flex;align-items:center;justify-content:center;font-family:inherit';
      o.innerHTML='<form style="background:#fff;color:#1b2430;padding:22px;border-radius:12px;width:min(360px,92vw);box-shadow:0 10px 40px rgba(0,0,0,.3)"><h3 style="margin:0 0 6px;font-size:16px">이름을 선택하세요<\u002Fh3><p style="margin:0 0 12px;font-size:12px;color:#5a6676">입력 기록과 업무 지시에 이 이름이 남습니다. 목록에 없으면 직접 적으세요.<\u002Fp><input list="nbp" required style="width:100%;box-sizing:border-box;padding:9px;font-size:14px;border:1px solid #b8c2cf;border-radius:8px" placeholder="이름"><datalist id="nbp">'+PEOPLE.map(p=>'<option value="'+p+'">').join('')+'<\u002Fdatalist><button style="margin-top:14px;width:100%;padding:10px;font-size:14px;border:0;border-radius:8px;background:#124e66;color:#fff;cursor:pointer">시작<\u002Fbutton><\u002Fform>';
      document.body.appendChild(o);
      o.querySelector('form').onsubmit=e=>{e.preventDefault();const v=o.querySelector('input').value.trim();if(v){ls('nb.me',v);o.remove();res(v)}};
    });
  }
  const user={async me(){let n=lg('nb.me');if(!n){if(document.readyState==='loading')await new Promise(r=>document.addEventListener('DOMContentLoaded',r));n=await askName()}return {name:n,id:n}},async can(){return true},async id(){return lg('nb.me')||''}};
  const dl={async save(x){const b=new Blob([x.data],{type:/\.html?$/.test(x.filename||'')?'text/html;charset=utf-8':'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=x.filename||'download.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);return {status:'saved'}}};
  window.claude={use:async n=>({db:db,user:user,downloads:dl})[n]||null};
})();

<script>
(function(){
'use strict';
const NOTE_TYPES=[];
const BAKE=/*DATA*/;
const COLL=(BAKE&&BAKE.coll)||'gt',RCOLL=COLL+'r';
const ADM=String(window.GT_ADMIN||'2023042_01');
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n).toLocaleString('ko-KR');
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

/* ---------- dates (UTC math, 'YYYY-MM-DD' strings) ---------- */
const DOW=['일','월','화','수','목','금','토'];
function pd(s){if(!s)return null;const a=s.split('-');return Date.UTC(+a[0],+a[1]-1,+a[2])}
function ds(ms){const d=new Date(ms);return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0')}
function addDays(s,n){return ds(pd(s)+n*864e5)}
function localToday(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fd(s){if(!s)return '-';const d=new Date(pd(s));const md=(d.getUTCMonth()+1)+'/'+d.getUTCDate();const y=d.getUTCFullYear();return (y===+S.base.slice(0,4)?md:String(y).slice(2)+'.'+md.replace('/','.'))+' ('+DOW[d.getUTCDay()]+')'}
function wk(days){return days<7?'1주 미만':Math.round(days/7)+'주'}

/* ---------- state ---------- */
const S={buyer:lsGet('nb.buyer')||'전체',base:localToday(),tab:'gantt',open:null,pinned:new Set(),openG:new Set(),sel:new Set(),per:'week',conn:'connecting',RO:false,me:''};

let dbc=null;

const BUYERS=['이준영','박형식','이주희','김혜린','김형수','조재완','김태희'];
const ADMINS=['김민','이기환'];const pLab=n=>n==='김민'?'김민 팀장 · 관리자':ADMINS.indexOf(n)>=0?n+' · 관리자':n;
const GONE=['Chris','김태균'];const slN=s=>s||'';
const pOpt=(b,on)=>'<option value="'+esc(b)+'"'+(on?' selected':'')+'>'+esc(pLab(b))+'<\u002Foption>';
const byKey=new Map();

function who(){return S.buyer!=='전체'?S.buyer:(S.me||'관리')}
function who(){return S.buyer!=='전체'?S.buyer:(S.me||'관리')}



/* ---------- small ui helpers ---------- */
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{t.hidden=true},2800)}
function copyText(txt,msg){
  const done=()=>toast(msg||'복사했습니다. 엑셀에 붙여넣으세요.');
  const fb=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){toast('복사하지 못했습니다.')}ta.remove()};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,fb)}else fb();
}
async function saveCsv(name,rows){
  const csv='﻿'+rows.map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  let dl=null;try{dl=window.claude&&await window.claude.use('downloads')}catch(e){}
  if(!dl){toast('이 화면에서는 파일 저장을 쓸 수 없습니다. 복사 버튼을 사용하세요.');return}
  try{await dl.save({filename:name,data:csv});toast('저장했습니다.')}catch(e){if(!e||e.code!=='declined')toast('저장하지 못했습니다.')}
}
function tsv(rows){return rows.map(r=>r.map(c=>String(c==null?'':c).replace(/[\t\r\n]+/g,' ')).join('\t')).join('\r\n')}
const PERL={};
function tfmt(iso){if(!iso)return '';const d=new Date(iso);return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
const PEOPLE=()=>Array.from(new Set(BUYERS.concat(Array.from(G.values()).map(g=>g.ow).filter(Boolean)).concat(ADMINS))).filter(b=>b!=='미지정').sort((a,b)=>(ADMINS.indexOf(a)>=0?1:0)-(ADMINS.indexOf(b)>=0?1:0));
/* ---------- 사업 진행 현황 (간트, 직접 입력) ---------- */
const G=new Map(),pendG=new Map(),chainG=new Map();
const GPH=[['rc','접수','var(--b3)'],['tc','기술 준비','var(--b1)'],['iv','재고 확인','var(--accent)'],['qt','재료 견적(구매)','var(--soon)'],['sb','제출','var(--ok)']];
const GST={prep:'제안 준비 중',wait:'회신 대기',neg:'협상',hold:'보류',won:'수주',lost:'실주',cancel:'취소',drop:'견적포기'};const CLOSED=['won','lost','cancel','drop'];
S.g={col:new Set(),who:lsGet('nb.gw')||'',sl:'',st:'all',yr:'',q:'',zoom:lsGet('nb.gz')||'12',off:0,del:''};
S.gopen=null;
const GZ={'12':{d:84,p:14,l:'12주'},'24':{d:168,p:7,l:'24주'},'52':{d:364,p:3,l:'1년'}};
function gid(){return 'g'+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function saveG(id,fn){
  if(S.RO)return Promise.resolve();
  const cur=JSON.parse(JSON.stringify(G.get(id)||{}));
  fn(cur);cur.u=new Date().toISOString();cur.by=who();
  G.set(id,cur);scheduleRender();
  pendG.set(id,(pendG.get(id)||0)+1);
  const prev=chainG.get(id)||Promise.resolve();
  const p=prev.then(()=>{if(dbc)return dbc.doc(COLL+'/'+id).set(cur)}).catch(e=>{toast('저장하지 못했습니다: '+((e&&e.message)||'알 수 없는 오류'))}).then(()=>{pendG.set(id,pendG.get(id)-1)});
  chainG.set(id,p);return p;
}
function delG(id){
  if(S.RO)return;G.delete(id);scheduleRender();
  pendG.set(id,(pendG.get(id)||0)+1);
  const prev=chainG.get(id)||Promise.resolve();
  chainG.set(id,prev.then(()=>{if(dbc)return dbc.doc(COLL+'/'+id).delete()}).catch(()=>{toast('삭제하지 못했습니다.')}).then(()=>{pendG.set(id,pendG.get(id)-1)}));
}

function gNext(g,td){
  let best=null;
  GPH.forEach(x=>{const ph=(g.ph||{})[x[0]];if(!ph||!ph.e||ph.d)return;if(!best||ph.e<best.e)best={k:x[0],n:x[1],e:ph.e}});
  if(best)best.dd=Math.round((pd(best.e)-pd(td))/864e5);
  return best;
}
const gYear=g=>{const r=g.rd||((g.ph||{}).rc||{}).s||Object.keys(g.ph||{}).map(k=>g.ph[k].s).filter(Boolean).sort()[0]||'';return r.slice(0,4)};
function gSel(){const f=S.g;return Array.from(G.values()).filter(g=>{const st=g.st||'prep';if(f.st==='act'&&CLOSED.indexOf(st)>=0)return false;if(f.st==='ext'){if(!gxPend(g).length)return false}else if(f.st!=='act'&&f.st!=='all'&&st!==f.st)return false;if(f.who&&(g.ow||'')!==f.who)return false;if(f.sl&&(g.sl||'')!==f.sl)return false;if(f.yr&&gYear(g)!==f.yr)return false;return true})}
function gRows(){
  const td=localToday(),f=S.g,q=f.q.trim().toLowerCase();
  const a=Array.from(G.entries()).map(([id,g])=>({id:id,g:g,nx:gNext(g,td)})).filter(r=>{
    const st=r.g.st||'prep';
    if(f.st==='act'&&CLOSED.indexOf(st)>=0)return false;
    if(f.st==='ext'){if(!gxPend(r.g).length)return false}else if(f.st!=='act'&&f.st!=='all'&&st!==f.st)return false;
    if(f.who&&(r.g.ow||'')!==f.who)return false;
    if(f.sl&&(r.g.sl||'')!==f.sl)return false;
    if(f.yr&&gYear(r.g)!==f.yr)return false;
    if(q&&((r.g.n||'')+' '+(r.g.ac||'')+' '+(r.g.nt||'')).toLowerCase().indexOf(q)<0)return false;
    return true;
  });
  a.sort((x,y)=>(x.nx?x.nx.e:'9999').localeCompare(y.nx?y.nx.e:'9999')||(x.g.n||'').localeCompare(y.g.n||'','ko'));
  return a;
}
function gStartMs(){const t=pd(localToday());const dow=(new Date(t).getUTCDay()+6)%7;return t-dow*864e5-14*864e5+S.g.off*7*864e5}
function renderGantt(){
  const ro=S.RO?' disabled':'',Z=GZ[S.g.zoom]||GZ['12'],td=localToday(),t0=gStartMs(),W=Z.d*Z.p;
  const rows=gRows();
  const sel=gSel(),all=sel.filter(g=>CLOSED.indexOf(g.st||'prep')<0);
  const fst=S.g.st,klab=(fst==='act'?'진행 중':fst==='all'?'전체':fst==='ext'?'연장 요청 대기':GST[fst])+' 사업'+(S.g.yr?' ('+S.g.yr+'년)':'');
  const nx=all.map(g=>gNext(g,td)).filter(Boolean);const nval=all.filter(g=>gAlerts(g,td).some(a=>a.k==='val'||a.k==='idle')).length;
  const kp=[[klab,sel.length,''],['7일 내 마감',nx.filter(x=>x.dd>=0&&x.dd<=7).length,'soon'],['마감 초과',nx.filter(x=>x.dd<0).length,'late'],['견적 유효·회신 확인',nval,'soon'],['연장 요청 대기',all.filter(g=>gxPend(g).length).length,'soon']];
  let h='<div style="display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-bottom:10px"><div><h3 style="margin:0;font-size:16px">사업 진행 현황 <span class="sync live" style="font-size:11px">실시간 반영<\u002Fspan><\u002Fh3><p class="help">사업별로 접수 → 기술 준비 → 재고 확인 → 재료 견적(구매) → 제출 일정을 직접 입력합니다. 막대나 사업명을 누르면 수정 창이 열립니다.<\u002Fp><\u002Fdiv><div class="gbtns" style="display:flex;gap:6px;flex-wrap:wrap">'+'<button class="btn ghost" type="button" data-act="st" title="접수·수주 현황 요약과 담당자별 알림(마감 초과·임박, 견적 유효기간)을 봅니다">현황·알림'+stBadge()+'<\u002Fbutton>'+'<button class="btn ghost" type="button" data-act="gimp" title="RFQ Control Board 엑셀을 올리면 휴니드 구분번호 기준으로 갱신·추가합니다. 일반 양식(엑셀 저장 파일)은 사업명 기준입니다"'+ro+'>엑셀 올리기<\u002Fbutton><button class="btn ghost" type="button" data-act="gcsv" title="지금 목록을 올리기 양식과 같은 엑셀(CSV)로 저장합니다">엑셀 저장<\u002Fbutton><button class="btn ghost" type="button" data-act="gprint" title="지금 보이는 화면 그대로 A4 가로로 인쇄합니다 (내려받은 HTML 파일에서 사용)">인쇄<\u002Fbutton><button class="btn" type="button" data-act="gadd"'+ro+'>+ 사업 추가<\u002Fbutton><button class="btn ghost" type="button" data-act="newhtml" title="지금 화면의 최신 사업 정보를 기준값으로 담은 새 HTML 파일을 만듭니다">새 HTML 만들기<\u002Fbutton><button class="btn ghost" type="button" data-act="rq" title="사이트 개선 요청을 남기고 확인 상태를 봅니다">개선사항요청'+rqBadge()+'<\u002Fbutton><\u002Fdiv><\u002Fdiv>';
  const names=Array.from(new Set(Array.from(G.values()).map(g=>g.ow).filter(Boolean)));
  h+='<div class="gtools"><label class="f grow" style="max-width:240px">검색<input type="search" id="gQ" value="'+esc(S.g.q)+'" placeholder="사업명 · 구분 · 메모"><\u002Flabel>'+
   '<label class="f">구매 담당<select id="gWho"><option value="">전체<\u002Foption>'+PEOPLE().concat(['미지정']).map(b=>pOpt(b,S.g.who===b)).join('')+'<\u002Fselect><\u002Flabel>'+
   '<label class="f">영업 담당<select id="gSl"><option value="">전체<\u002Foption>'+Array.from(new Set(Array.from(G.values()).map(g=>g.sl).filter(Boolean))).sort().map(b=>'<option value="'+esc(b)+'"'+(S.g.sl===b?' selected':'')+'>'+esc(slN(b))+'<\u002Foption>').join('')+'<\u002Fselect><\u002Flabel>'+
   '<label class="f">연도(접수)<select id="gYr"><option value="">전체<\u002Foption>'+Array.from(new Set(Array.from(G.values()).map(gYear).filter(Boolean))).sort().reverse().map(y=>'<option'+(S.g.yr===y?' selected':'')+' value="'+y+'">'+y+'년<\u002Foption>').join('')+'<\u002Fselect><\u002Flabel>'+
   '<label class="f">상태<select id="gSt">'+[['all','전체'],['prep','제안 준비 중'],['ext','연장 요청 대기'],['act','진행 중(종료 건 제외)']].concat(Object.keys(GST).filter(k=>k!=='prep').map(k=>[k,GST[k]])).map(o=>'<option value="'+o[0]+'"'+(S.g.st===o[0]?' selected':'')+'>'+o[1]+'<\u002Foption>').join('')+'<\u002Fselect><\u002Flabel>'+
   '<label class="f">보기 기간<select id="gZ">'+Object.keys(GZ).map(k=>'<option value="'+k+'"'+(S.g.zoom===k?' selected':'')+'>'+GZ[k].l+'<\u002Foption>').join('')+'<\u002Fselect><\u002Flabel>'+
   '<button class="btn ghost sm" type="button" data-act="gprev">◀ 4주<\u002Fbutton><button class="btn ghost sm" type="button" data-act="gtoday">오늘<\u002Fbutton><button class="btn ghost sm" type="button" data-act="gnext">4주 ▶<\u002Fbutton>'+

function impColMap(hdr){
  const map={},hu={};let hit=0;
  hdr.forEach((h,i)=>{
    const k=nl(h);if(!k)return;
    if(k==='통화'||k==='currency'){if(!('cur' in map)){map.cur=i;hit++}return}
    if(k.indexOf('환율')>=0){if(!('fx' in map)){map.fx=i;hit++}return}
    if(k.indexOf('합계')>=0||k.indexOf('비율')>=0||k.indexOf('(%)')>=0){map._r=i;return}
    const MM={'매출액':'sa','재료비':'sm','노무비':'sl','경비':'sx','자재비':'pm','부대비':'pb','lossrate':'pl','포장비':'pp','총수주제안자재비':'sm'};
    {const hm=k.match(/\((usd|\$|원|krw)\)/),kk=k.replace(/\((usd|\$|원|krw)\)/g,'');if(MM[kk]){const f=MM[kk];if(!(f in map)){map[f]=i;hit++;if(hm)hu[f]=/원|krw/.test(hm[1])?'KRW':'USD'}return}}
    for(const f in IMPF){if(IMPF[f].some(a=>nl(a)===k)){if(!(f in map)){map[f]=i;hit++}return}}
    const m=k.match(/^(접수|기술준비|재고확인|재료견적|제출)(시작|종료)$/);
    if(m){const ph=GPH.find(x=>nl(x[1])===m[1]);if(ph){const key=ph[0]+(m[2]==='시작'?'s':'e');if(!(key in map)){map[key]=i;hit++}}}
  });
  return {map:map,hit:hit,hu:hu};
}

function impParse(wb){
  let best=null;

    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:''});
    for(let h=0;h<Math.min(rows.length,12);h++){
      const c=impColMap(rows[h]);if(!('n' in c.map))continue;
      if(!best||c.hit>best.hit)best={sn:sn,h:h,rows:rows,map:c.map,hit:c.hit,hu:c.hu,hdr:rows[h]};
    }
  });
  return best;
}
function impDiff(P){

    {

      const fileCur=/krw|원|won/.test(rcRaw)?'KRW':/usd|\$|달러|dollar/.test(rcRaw)?'USD':null;
      const fxRaw=numOf(cell(row,'fx')),firstHint=Object.values(P.hu||{})[0]||null;
      const tcur=g?curOf(g):(fileCur||firstHint||'USD'),tfx=g?fxOf(g):(fxRaw&&fxRaw>0?fxRaw:1320);
      let any=false;
      MA.concat(MB).forEach(([f,lab])=>{
        if(!(f in P.map))return;const raw=cell(row,f);if(raw===''||raw==null)return;
        let v=numOf(raw);if(v==null){warn.push(name+': '+lab+' 숫자를 읽지 못함 "'+raw+'"');return}
        const rc=(P.hu||{})[f]||fileCur||tcur;

    GPH.forEach(x=>['s','e'].forEach(se=>{
      const key=x[0]+se;if(!(key in P.map))return;
      const raw=cell(row,key),v=nvd(raw);if(raw===''||raw==null)return;
      if(!v){warn.push(name+': '+x[1]+(se==='s'?' 시작':' 종료')+' 날짜를 읽지 못함 "'+raw+'"');return}

    }));
    if(!g)out.push({id:null,name:name,patch:patch,ch:ch.length?ch:['새 사업'],isNew:true});
    else if(ch.length)out.push({id:id,name:name,patch:patch,ch:ch,isNew:false});
  }

}

  let ok=true;

const ROLEL={buy:'구매',sales:'영업',tech:'기술(항공전자솔루션)',prod:'생산관리'};

function gAlerts(g,td){
  const out=[],st=g.st||'prep';if(CLOSED.indexOf(st)>=0)return out;
  const nx=gNext(g,td);
  if(nx&&nx.dd<0)out.push({k:'late',l:'마감 초과',t:nx.n+' 마감 '+(-nx.dd)+'일 초과 ('+fd(nx.e)+')'+deptNote(nx,g),o:nx.dd,r:ROLEOF[nx.k]||'buy'});
  else if(nx&&nx.dd<=ALERT.soon)out.push({k:'soon',l:'마감 임박',t:nx.n+' 마감 '+(nx.dd===0?'오늘':nx.dd+'일 후')+' ('+fd(nx.e)+')'+deptNote(nx,g),o:nx.dd,s:nx.k==='sb',r:ROLEOF[nx.k]||'buy'});
  if(st==='wait'||st==='neg'){
    const vd=nvd(g.vd);
    if(vd){const dd=Math.round((pd(vd)-pd(td))/864e5);
      if(dd<0)out.push({k:'val',l:'유효기간',t:'견적 유효기간 '+(-dd)+'일 경과 ('+fd(vd)+') — 재견적 또는 유효기간 연장 확인',o:dd,r:'buy'});

/* ---------- 수주금액 · 수주자재비 (통화 USD/원, 환율 수정) ---------- */
const numOf=v=>{const s=String(v==null?'':v).replace(/[,\s$]|USD|usd|원|KRW|krw/g,'');return s!==''&&!isNaN(+s)?+s:null};
const curOf=g=>g&&g.cur==='KRW'?'KRW':'USD';
const fxOf=g=>{const v=numOf(g&&g.fx);return v&&v>0?v:1320};
const fmN=(n,c)=>n==null?'':(c==='KRW'?Math.round(n):Math.round(n*100)/100).toLocaleString('en-US',{maximumFractionDigits:c==='KRW'?0:2});
const fmC=(c,n)=>n==null?'':(c==='KRW'?fmN(n,c)+'원':'USD '+fmN(n,c));
const rnd=(n,c)=>c==='KRW'?Math.round(n):Math.round(n*100)/100;
const MA=[['sa','매출액'],['sm','재료비'],['sl','노무비'],['sx','경비']];
const MB=[['pm','자재비'],['pb','부대비'],['pl','Loss Rate'],['pp','포장비']];
const MK=MA.concat(MB).map(x=>x[0]);
function mv(g,k){
  const v=numOf(g[k]);if(v!=null)return v;
  if(k==='sm'&&(g.sm==null||g.sm==='')&&numOf(g.po)!=null)return numOf(g.po);
  if(k==='pm'&&MB.every(x=>g[x[0]]==null||g[x[0]]==='')&&numOf(g.mc)!=null)return numOf(g.mc);
  return null;
}
const msum=(g,ks)=>{let n=0,any=false;ks.forEach(k=>{const v=mv(g,k);if(v!=null){n+=v;any=true}});return any?n:null};
const costA=g=>msum(g,['sm','sl','sx']);
const sumB=g=>msum(g,MB.map(x=>x[0]));
const pct=(a,b)=>a!=null&&b!=null&&b!==0?a/b*100:null;
const fp=v=>v==null?'–':v.toFixed(1)+'%';
function gRatio(g){const sm=mv(g,'sm'),sb=sumB(g);return sm&&sm>0&&sb!=null?sb/sm*100:null}
function mCalc(g){
  const c=curOf(g),f=fxOf(g),sa=mv(g,'sa'),ca=costA(g),sb=sumB(g),r={},ok=sa!=null&&sa>0;
  MA.forEach(x=>{const v=mv(g,x[0]);r['a-'+x[0]]=x[0]==='sa'?(ok?'100.0%':'–'):fp(ok?pct(v,sa):null)});
  r['a-cost']=fmN(ca,c);r['a-costp']=fp(ok?pct(ca,sa):null);
  const pr=ok&&ca!=null?sa-ca:null;r['a-profit']=pr==null?'':(pr<0?'-':'')+fmN(Math.abs(pr),c);r['a-profitp']=fp(ok&&pr!=null?pct(pr,sa):null);r._neg=pr!=null&&pr<0;
  MB.forEach(x=>{const v=mv(g,x[0]);r['b-'+x[0]]=fp(sb?pct(v,sb):null)});
  r['b-sum']=fmN(sb,c);r['b-sump']=sb?'100.0%':'–';
  const rt=gRatio(g),sm=mv(g,'sm'),oc=c==='USD'?'KRW':'USD',oconv=x=>c==='USD'?x*f:x/f;
  r.cmp=rt==null?'<span class="gmr-n">재료비와 수주자재비 항목을 입력하면 재료비 대비 수주자재비 합계 비율이 표시됩니다.</span>':
   '<span class="gmr-l">수주금액 재료비 대비 수주자재비 합계</span> <b class="gmr-v'+(rt>100?' up':'')+'">'+rt.toFixed(1)+'%</b> <span class="gmr-n">'+fmC(c,sb)+' / '+fmC(c,sm)+(rt>100?' · 재료비 초과 '+fmC(c,sb-sm):' · 여유 '+fmC(c,sm-sb))+'<br>(환산: 수주자재비 합계 '+fmC(oc,oconv(sb))+' / 재료비 '+fmC(oc,oconv(sm))+' · 1 USD = '+fmN(f,'USD')+'원)</span>';
  return r;
}
function mApply(g){
  const r=mCalc(g);
  Object.keys(r).forEach(k=>{if(k==='_neg')return;const el=document.querySelector('[data-mo="'+k+'"]');if(!el)return;if(k==='cmp')el.innerHTML=r[k];else el.textContent=r[k]});
  const pe=document.querySelector('[data-mo="a-profit"]');if(pe)pe.classList.toggle('neg',!!r._neg);
}

     MB.map(x=>row(x[0],x[1],'b-')).join('')+

}

function gAlerts(g,td){
  const out=[],st=g.st||'prep';if(CLOSED.indexOf(st)>=0)return out;

  else if(nx&&nx.dd<=ALERT.soon)out.push({k:'soon',l:'마감 임박',t:nx.n+' 마감 '+(nx.dd===0?'오늘':nx.dd+'일 후')+' ('+fd(nx.e)+')'+deptNote(nx,g),o:nx.dd,s:nx.k==='sb',r:ROLEOF[nx.k]||'buy'});
  if(st==='wait'||st==='neg'){
    const vd=nvd(g.vd);
    if(vd){const dd=Math.round((pd(vd)-pd(td))/864e5);
      if(dd<0)out.push({k:'val',l:'유효기간',t:'견적 유효기간 '+(-dd)+'일 경과 ('+fd(vd)+') — 재견적 또는 유효기간 연장 확인',o:dd,r:'buy'});

    if(se){const dd=Math.round((pd(td)-pd(se))/864e5);if(dd>=ALERT.idle)out.push({k:'idle',l:'회신 확인',t:'견적 제출 후 '+dd+'일 경과 — 고객 회신 확인',o:-dd,r:'buy'})}
    if(g.rz==='수주확정')out.push({k:'po',l:'수주확정',t:'수주확정 건 — PO 수령·등록 확인',o:999,r:'buy'});
  }

}

   case 'rq':rqOpen();break;

   case 'rqf':S.rq.f=ac.dataset.f;rqRenderList();break;
   case 'rqsubmit':case 'rqadmask':case 'rqadmx':case 'rqadmok':case 'rqadmoff':case 'rqdone':case 'rqundo':case 'rqdel':rqAct(a,ac.dataset.id);break;
   case 'mtog':S.mopen=S.mopen===S.gopen?null:S.gopen;renderDrawer();break;
   case 'mconv':mConv();break;
   case 'gprint':gPrint();break;
   case 'gcsv':saveCsv('사업진행현황_'+localToday()+'.csv',gTable());break;
   case 'gimp':if(S.RO){toast('지금은 수정할 수 없습니다.');break}if(!window.XLSX){toast('엑셀 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하세요.');break}$('#impf').value='';$('#impf').click();break;
   case 'gcopy':{const td=localToday();copyText(tsv([['사업명','구분','구매 담당','상태'].concat(GPH.map(x=>x[1]+' 시작')).concat(GPH.map(x=>x[1]+' 종료')).concat(['다음 마감','메모'])].concat(gRows().map(r=>{const ph=r.g.ph||{};return [r.g.n,r.g.ac,r.g.ow,GST[r.g.st||'prep']].concat(GPH.map(x=>(ph[x[0]]||{}).s||'')).concat(GPH.map(x=>(ph[x[0]]||{}).e||'')).concat([r.nx?r.nx.n+' '+r.nx.e:'',r.g.nt])}))),'사업 일정을 복사했습니다. 엑셀에 붙여넣으세요.');break}
   case 'gxopen':case 'gxcancel':case 'gxsubmit':case 'gxok':case 'gxno':case 'gxdel':gxAct(a,ac.dataset.x);break;
   case 'gdel':if(S.gopen){if(S.g.del===S.gopen){const id=S.gopen;S.g.del='';S.gopen=null;delG(id);renderDrawer()}else{S.g.del=S.gopen;renderDrawer()}}break;
   case 'gauto':if(S.gopen)saveG(S.gopen,g=>{const ph=g.ph=g.ph||{};const rc=ph.rc=ph.rc||{},sb=ph.sb=ph.sb||{};const s=rc.s||rc.e,e=sb.e||sb.s;if(!s||!e||e<=s){toast('접수 시작일과 제출 종료일을 먼저 넣으세요.');return}
      const W=[1,4,1,4],keys=['rc','tc','iv','qt'],tot=Math.max(4,Math.round((pd(e)-pd(s))/864e5)),sum=8;let cur=pd(s);
      keys.forEach((k,i)=>{const len=Math.max(1,Math.round(tot*W[i]/sum));const a=ds(cur),b=ds(Math.min(pd(e)-864e5,cur+(len-1)*864e5));ph[k]=Object.assign(ph[k]||{},{s:a,e:b<a?a:b});cur=pd(ph[k].e)+864e5});
      sb.s=e;sb.e=e});break;
  }
});

document.addEventListener('change',function(e){
  const t=e.target;
  if(t.id==='gSl'){S.g.sl=t.value;renderGantt();return}
  if(t.id==='gWho'){S.g.who=t.value;lsSet('nb.gw',t.value);renderGantt();return}
  if(t.id==='gYr'){S.g.yr=t.value;renderGantt();return}
  if(t.id==='gSt'){S.g.st=t.value;renderGantt();return}
  if(t.id==='gZ'){S.g.zoom=t.value;lsSet('nb.gz',t.value);renderGantt();return}
  if(t.dataset.gx){S.gx[t.dataset.gx]=t.value;return}
  if(t.dataset.gf&&S.gopen){const f=t.dataset.gf;saveG(S.gopen,g=>{g[f]=t.value});return}
  if(t.dataset.gp&&S.gopen){const a=t.dataset.gp.split('|');saveG(S.gopen,g=>{const ph=g.ph=g.ph||{};const p=ph[a[0]]=ph[a[0]]||{};if(a[1]==='d')p.d=t.checked?1:0;else p[a[1]]=t.value;if(!p.s&&!p.e&&!p.d)delete ph[a[0]]});return}
  if(t.id==='buyerSel'){S.buyer=t.value;lsSet('nb.buyer',S.buyer);S.g.who=S.buyer==='전체'?'':S.buyer;lsSet('nb.gw',S.g.who);renderAll();return}
});
document.addEventListener('keydown',function(e){
  const t=e.target;
  if(e.key==='Escape'&&S.gopen){S.gopen=null;renderDrawer();return}
});
document.addEventListener('input',function(e){
  const t=e.target;
  if(t.id==='gQ'){S.g.q=t.value;clearTimeout(S._gt);S._gt=setTimeout(()=>{const pos=t.selectionStart;renderGantt();const n=$('#gQ');if(n){n.focus();n.setSelectionRange(pos,pos)}},180);return}
  if(t.dataset.gx){S.gx[t.dataset.gx]=t.value;return}

});
document.addEventListener('focusout',function(){if(S._defer){setTimeout(()=>{if(!isTyping()){S._defer=false;renderAll()}},60)}});
$('#scrim').addEventListener('click',()=>{S.gopen=null;renderDrawer()});

/* ---------- shared storage ---------- */
(async function connect(){
  let slow=setTimeout(()=>{if(S.conn==='connecting'){S.conn='slow';renderHeader()}},10000);
  try{
    const cl=window.claude;if(!cl||!cl.use){S.conn='off';clearTimeout(slow);renderAll();return}
    const db=await cl.use('db');
    if(!db){clearTimeout(slow);S.conn='off';renderAll();return}
    dbc=db;
    try{const u=await cl.use('user');if(u&&typeof u.isOwner==='function'&&u.isOwner())S.rq.adm=true}catch(e){}
    db.collection(RCOLL).onSnapshot(snap=>{
      snap.docs.forEach(d=>{const k=d.id;if(pendR.get(k)>0)return;if(d.exists)RQ.set(k,d.data());else RQ.delete(k)});
      const ids=new Set(snap.docs.map(d=>d.id));Array.from(RQ.keys()).forEach(k=>{if(!ids.has(k)&&!(pendR.get(k)>0))RQ.delete(k)});
      rqRefresh();
    },()=>{});
    db.collection(COLL).onSnapshot(snap=>{clearTimeout(slow);S.RO=false;S.conn='live';
      let firstSnap=false;if(BAKE&&!seedTried){seedTried=true;firstSnap=true;seedBake(snap)}
      snap.docs.forEach(d=>{const k=d.id;if(k.charAt(0)==='_')return;if(pendG.get(k)>0)return;if(d.exists)G.set(k,d.data());else G.delete(k)});
      const ids=new Set(snap.docs.map(d=>d.id));Array.from(G.keys()).forEach(k=>{if(!ids.has(k)&&!(pendG.get(k)>0))G.delete(k)});
      if(BAKE)migBake();
      scheduleRender();renderHeader();
    },err=>{clearTimeout(slow);S.conn=(err&&err.code==='revoked')?'off':'slow';renderAll()});
  }catch(e){clearTimeout(slow);S.conn='off';renderAll()}
})();

renderAll();
})();

</script>
